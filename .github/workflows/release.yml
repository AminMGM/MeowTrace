name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Rust unit tests
        working-directory: core-rs
        run: cargo test --release

      - name: Install dependencies
        run: npm ci

      - name: Build core (WASM) from source
        run: npm run core

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      # One release holding the installer, its .blockmap and latest.yml — what
      # electron-updater needs for differential updates. electron-builder's
      # parallel uploads can race and create duplicate releases, so publishing
      # happens here in a single step (stale releases for the tag are removed).
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done
          gh release create "$TAG" dist/MeowTrace-Setup-*.exe dist/MeowTrace-Setup-*.exe.blockmap dist/latest.yml \
            --title "MeowTrace ${TAG#v}" \
            --notes "Download **MeowTrace-Setup-${TAG#v}.exe** below. Installed copies update themselves with small differential downloads."
