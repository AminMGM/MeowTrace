name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Rust unit tests
        working-directory: core-rs
        run: cargo test --release

      - name: Install dependencies
        run: npm ci

      - name: Build core (WASM) from source
        run: npm run core

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # --publish always uploads the NSIS installer, its .blockmap and
      # latest.yml — what electron-updater needs for differential updates.
      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
