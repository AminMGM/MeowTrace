appId: com.aminmgm.meowtrace
productName: MeowTrace
copyright: Copyright © 2026 AminMGM

directories:
  buildResources: build
  output: dist

# Only the English Chromium locale — saves ~48 MB unpacked.
electronLanguages:
  - en-US

files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  # onnxruntime-web: only the Node build and its single CPU wasm are used
  # (by the anime worker); the other ~130 MB of browser variants are dropped.
  - '!node_modules/onnxruntime-web/{lib,docs}/**'
  - '!node_modules/onnxruntime-web/dist/**'
  - node_modules/onnxruntime-web/dist/ort.node.min.js
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs
  - node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm

# Worker threads and the wasm runtime load files by path, so keep them out of the asar.
asarUnpack:
  - out/main/chunks/anime-worker-*.js
  - node_modules/onnxruntime-web/**
  - node_modules/onnxruntime-common/**

fileAssociations:
  - ext: [png, jpg, jpeg, webp, bmp, gif]
    name: Image
    role: Viewer
    description: Open with MeowTrace

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

# NSIS + blockmap = electron-updater differential updates: only changed
# blocks are downloaded, never the whole installer again.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  differentialPackage: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeowTrace
  uninstallDisplayName: MeowTrace

publish:
  provider: github
  owner: AminMGM
  repo: MeowTrace
  releaseType: release
