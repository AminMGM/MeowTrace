[package]
name = "meowtrace-core"
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["AminMGM"]
description = "Raster-to-vector tracing engine: OKLab colour quantization with anti-alias edge snapping, potrace-style Bezier fitting with corner restoration, stacked layers and centerline tracing. Zero dependencies, builds to WebAssembly."
repository = "https://github.com/AminMGM/MeowTrace"
keywords = ["vectorize", "trace", "svg", "potrace", "bitmap"]
categories = ["graphics", "multimedia::images"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
