<!doctype html>
<html>
  <head>
    <style>
      body { color: #eee; font-family: sans-serif; font-size: 12px; padding: 10px; }
      sp-button { width: 100%; margin-top: 8px; }
      #status { margin-top: 10px; color: #aaa; }
      label { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    </style>
  </head>
  <body>
    <sp-heading size="XS">MeowTrace Bridge</sp-heading>
    <sp-body size="S">Pulls the latest “Send to Photoshop” from the MeowTrace app (enable the bridge in MeowTrace → Settings).</sp-body>
    <label>Port <input id="port" type="number" value="47811" style="width: 80px" /></label>
    <label><input id="auto" type="checkbox" checked /> Open automatically</label>
    <sp-button id="pull" variant="cta">Open latest</sp-button>
    <div id="status">Waiting…</div>
    <script src="index.js"></script>
  </body>
</html>
